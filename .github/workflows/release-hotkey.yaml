name: Publish @spectreforge/sugarcube-hotkey to npm

on:
  push:
    tags: ["hotkey-v*"]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack (non-Windows)
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      # Only the newest stable release takes `latest`. npm rejects dist-tags
      # which are valid semver ranges, hence no `v0.1` for older releases.
      - name: Check the tag against the package version
        id: version
        run: |
          version=$(node -p 'require("./packages/hotkey/package.json").version')
          if [[ $GITHUB_REF_NAME != "hotkey-v$version" ]]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the package version $version"
            exit 1
          fi
          newest=$(git ls-remote --tags --refs origin 'hotkey-v*' | sed 's|.*refs/tags/hotkey-v||' | grep -v -e - | sort -V | tail -n 1)
          if [[ $version == *-* ]]; then
            dist_tag=next
          elif [[ $version == "$newest" ]]; then
            dist_tag=latest
          else
            dist_tag="release-${version%.*}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build packages
        run: yarn build-packages
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hotkey-dist
          path: packages/hotkey/dist
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing (OIDC) and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable Corepack (non-Windows)
        run: corepack enable
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hotkey-dist
          path: packages/hotkey/dist
      - name: Publish
        env:
          DIST_TAG: ${{ needs.build.outputs.dist-tag }}
        run: yarn workspace @spectreforge/sugarcube-hotkey npm publish --staged --provenance --access public --tag "$DIST_TAG"

  # for Twine users who can't install packages
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hotkey-dist
          path: dist
      - name: Create the release draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --draft
          --verify-tag
          --title "@spectreforge/sugarcube-hotkey v$VERSION"
          $([[ $VERSION == *-* ]] && echo --prerelease)
